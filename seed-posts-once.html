function runSeed() {
  btn.disabled = true;

  auth.onAuthStateChanged((user) => {
    if (!user) {
      log('❌ আপনি লগইন করা নেই। প্রথমে admin.html-এ লগইন করে তারপর এই পেজে আসুন।', true);
      btn.disabled = false;
      return;
    }

    log('✅ লগইন ঠিক আছে (' + user.email + ') — পোস্ট যোগ করা হচ্ছে...');

    const promises = posts.map(p =>
      db.collection('posts').doc(p.slug).set(p.data)
        .then(() => log('✅ যোগ হয়েছে: ' + p.data.name))
        .catch(err => log('❌ সমস্যা হয়েছে (' + p.slug + '): ' + err.message, true))
    );

    Promise.all(promises).then(() => {
      log('🎉 সম্পন্ন! এখন admin.html-এ "পোস্ট" ট্যাবে গিয়ে দেখুন, আর products/index.html পেজেও গ্রিডে দেখা যাবে। এই ফাইলটা এখন GitHub থেকে মুছে ফেলতে পারেন।');
    });
  });
}
